{% extends "base.html" %}
{% block content %}
<section class="trade-shell">
  <form method="post" class="panel form-panel amount-form">{% csrf_token %}
    <p class="eyebrow">Demo Deposit</p><h2>Add sandbox funds</h2>
    <p class="notice">Simulated successful deposits only. No bank payment API is connected.</p>
    <div class="amount-pills"><button type="button" data-amount="5000">NGN 5,000</button><button type="button" data-amount="10000">NGN 10,000</button><button type="button" data-amount="50000">NGN 50,000</button><button type="button" data-amount="100000">NGN 100,000</button></div>
    <label>Custom amount{{ form.amount }}</label>
    <button class="btn primary wide">Simulate Deposit</button>
  </form>
</section>
{% endblock %}
